name: Bug
description: Report a reproducible Mailroom problem
title: "bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Remove private email, addresses, Worker URLs, ids, and secrets.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Give the smallest synthetic reproduction.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: "@iannuttall/mailroom 0.1.0"
    validations:
      required: true
